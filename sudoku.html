<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>高速ナンプレ</title>

    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        @font-face {
            font-family: 'Nosutaru-dotMPlusH-10-Regular';
            src: url('./Nosutaru-dotMPlusH-10-Regular.ttf') format('truetype');
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <!-- 🟢 ここを追加：Press Start 2P フォントの読み込み -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
 <!--   <link rel="stylesheet" href="sudoku.css">  -->
    <link rel="stylesheet" href="Sudoku-css/01-sudoku-variables.css">
</head>
<body>
<!-- 🟢 ここを追加：CRT走査線エフェクト overlay -->
  <div id="crt-overlay"></div>
    <div id="menu-screen" class="screen-container">
        <button class="settings-btn" onclick="openSettingsModal()" title="設定" aria-label="設定">
            <svg viewBox="0 0 24 24">
                <path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6-3.6z"/>
            </svg>
        </button>
        <h1 class="menu-title">
            <img src="title-nanpure-light.png" alt="高速ナンプレ" class="title-image">
        </h1>
        <div class="retro-start-text">- PRESS START -</div>
        <div class="menu-difficulty-list">
            <button class="btn-menu" onclick="handleMenuGenerate('easy')">
                <span class="en">EASY</span> <span class="jp">初級</span>
            </button>
            <button class="btn-menu" onclick="handleMenuGenerate('normal')">
                <span class="en">NORMAL</span> <span class="jp">中級</span>
            </button>
            <button class="btn-menu" onclick="handleMenuGenerate('hard')">
                <span class="en">HARD</span> <span class="jp">上級</span>
            </button>
            <button class="btn-menu" onclick="handleMenuGenerate('expert')">
                <span class="en">MASTER</span> <span class="jp">超級</span>
            </button>
        </div>
         <!-- 🟢 ハブに戻るボタンを追加 -->
    <div style="margin-top: 15px; text-align: center;">
      <button class="back-btn" onclick="backToHubFromDifficulty()">‹ GAME SELECT</button>
    </div>
        <button class="btn-menu-load-trigger" onclick="openLoadModal()">LOAD SAVE DATA</button>
    </div>

    <div id="game-screen" class="screen-container" style="display: none;">
        <button class="settings-btn" onclick="openSettingsModal()" title="設定" aria-label="設定">
            <svg viewBox="0 0 24 24">
                <path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6-3.6z"/>
            </svg>
        </button>
        
        <div class="status-bar">
            <div class="status-row-top">
                <span id="status-difficulty" class="badge">中級</span>
                <span id="status-timer">⏱ 00:00</span>
                <span id="status-score">SCORE: 0</span>
            </div>
            <div class="status-row-bottom">
                <span id="status-miss">MISS: 0</span>
                <span id="status-combo">0 COMBO</span>
            </div>
        </div>

        <div class="grid-wrapper">
            <div class="grid" id="sudoku-grid"></div>
        </div>

        <div class="error-message" id="error-text"></div>

        <div class="keypad-container" id="num-pad-area">
            
            <div class="left-pad-area">
                <div class="memo-pad">
                    <div class="pad-title">MEMO</div>
                    <button class="btn-memo-num" onclick="pressMemoNumber(1)">1</button>
                    <button class="btn-memo-num" onclick="pressMemoNumber(2)">2</button>
                    <button class="btn-memo-num" onclick="pressMemoNumber(3)">3</button>
                    <button class="btn-memo-num" onclick="pressMemoNumber(4)">4</button>
                    <button class="btn-memo-num" onclick="pressMemoNumber(5)">5</button>
                    <button class="btn-memo-num" onclick="pressMemoNumber(6)">6</button>
                    <button class="btn-memo-num" onclick="pressMemoNumber(7)">7</button>
                    <button class="btn-memo-num" onclick="pressMemoNumber(8)">8</button>
                    <button class="btn-memo-num" onclick="pressMemoNumber(9)">9</button>
                </div>
                
                <button class="btn-hint" onclick="triggerHint()">HINT</button>
            </div>

            <div class="main-pad">
                <div class="pad-title">INPUT</div>
                <button class="num-btn" id="btn-num-1" onclick="pressMainNumber(1)">1<span class="num-count" id="count-1">0/9</span></button>
                <button class="num-btn" id="btn-num-2" onclick="pressMainNumber(2)">2<span class="num-count" id="count-2">0/9</span></button>
                <button class="num-btn" id="btn-num-3" onclick="pressMainNumber(3)">3<span class="num-count" id="count-3">0/9</span></button>
                <button class="num-btn" id="btn-num-4" onclick="pressMainNumber(4)">4<span class="num-count" id="count-4">0/9</span></button>
                <button class="num-btn" id="btn-num-5" onclick="pressMainNumber(5)">5<span class="num-count" id="count-5">0/9</span></button>
                <button class="num-btn" id="btn-num-6" onclick="pressMainNumber(6)">6<span class="num-count" id="count-6">0/9</span></button>
                <button class="num-btn" id="btn-num-7" onclick="pressMainNumber(7)">7<span class="num-count" id="count-7">0/9</span></button>
                <button class="num-btn" id="btn-num-8" onclick="pressMainNumber(8)">8<span class="num-count" id="count-8">0/9</span></button>
                <button class="num-btn" id="btn-num-9" onclick="pressMainNumber(9)">9<span class="num-count" id="count-9">0/9</span></button>
            </div>

        </div>
    </div>

    <div class="modal-overlay" id="settings-modal">
        <div class="modal-content">
            <div class="modal-title">SETTINGS</div>

            <div class="setting-item" id="setting-item-mode">
                <div class="setting-label">プレイモード</div>
                <div class="mode-select-buttons">
                    <button id="btn-mode-blind" class="btn-setting-action active" onclick="setJudgeMode('blind')">ブラインド</button>
                    <button id="btn-mode-assist" class="btn-setting-action" onclick="setJudgeMode('normal')">ノーマル</button>
                </div>
            </div>

            

            <div id="game-actions-area" style="display: none; border-top: 1px solid var(--border); margin-top: 15px; padding-top: 15px; flex-direction: column; gap: 8px;">
                <button class="btn-setting-action" style="border-color: var(--primary); color: var(--primary);" onclick="triggerSave()">この問題を保存する</button>
                <button class="btn-setting-action" onclick="triggerReset()">最初から解き直す</button>
                <button class="btn-setting-action" style="border-color: var(--error); color: var(--error);" onclick="triggerQuit()">メニューに戻る</button>
            </div>

            <button class="btn-modal-close" onclick="closeSettingsModal()">閉じる</button>
        </div>
    </div>

    <div class="modal-overlay" id="load-modal">
        <div class="modal-content">
            <div class="modal-title">SAVE DATA</div>
            <div class="save-list" id="modal-save-list"></div>
            <button class="btn-modal-close secondary" onclick="closeLoadModal()">閉じる</button>
        </div>
    </div>

    <script src="sudoku.js"></script>
</body>
</html>
